<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print — Backup QR</title>
<style>
  @page { size: letter; margin: 0.5in; }
  body { font-family: -apple-system, "Helvetica Neue", sans-serif; text-align: center; background: #fff; color: #111; }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; color: #c0392b; }
  h2 { font-size: 14px; font-weight: 600; color: #777; margin-bottom: 24px; }
  .qr-container { margin: 24px 0; }
  .qr-container img { width: 300px; height: 300px; }
  .info-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: 12px; padding: 16px; max-width: 440px; margin: 0 auto; text-align: left; font-size: 14px; line-height: 1.6; }
  .url { font-family: monospace; font-size: 14px; color: #c0392b; word-break: break-all; }
  .footer { margin-top: 32px; font-size: 11px; color: #aaa; }
</style>
</head>
<body>

<h1>If the other QR doesn't work — scan this</h1>
<h2>(Some older phones don't recognize the short address. This uses a direct link.)</h2>
<div class="qr-container">
  <img src="qr-3-singer-ip-fallback.png" alt="Backup — request a song">
</div>
<div class="info-box">
  <strong>Or type this in your browser:</strong><br>
  <span class="url">http://rig.local:3300/singer</span><br><br>
  Same page — pick a song, join the queue, Danny calls you up!
</div>
<div class="footer">Placeholder Duo — Live Band Karaoke</div>

</body>
</html>
