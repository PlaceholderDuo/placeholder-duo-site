<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placeholder Duo</title>
  <meta name="description" content="Support live music — tip and follow us on social media.">
  <meta name="theme-color" content="#111111">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #111111;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .card {
      background: #1a1a1a;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      padding: 40px 28px 36px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    /* Logo */
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 2px solid #333;
      margin: 0 auto 20px;
      display: block;
      overflow: hidden;
      padding: 8px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Band name */
    .band-name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 12px;
    }

    /* Tagline */
    .tagline {
      font-size: 0.95rem;
      color: #999;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* Section labels */
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #555;
      margin-bottom: 12px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      min-height: 56px;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    .btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .btn-label {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .btn-handle {
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.75;
    }

    /* Primary buttons */
    .btn--venmo {
      background: #3d95ce;
    }

    .btn--cashapp {
      background: #00c853;
    }

    /* Secondary buttons */
    .btn--secondary {
      background: #2a2a2a;
      color: #ccc;
      padding: 14px 20px;
      min-height: 50px;
    }

    .btn--secondary:hover {
      background: #333;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 8px 0 24px;
    }

    /* Footer */
    .footer {
      font-size: 0.8rem;
      color: #555;
      margin-top: 8px;
    }

    /* Light mode / outdoor contrast */
    @media (prefers-color-scheme: light) {
      body {
        background: #f5f5f5;
      }

      .card {
        background: #ffffff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      }

      .band-name {
        color: #111;
      }

      .tagline {
        color: #666;
      }

      .logo {
        background: #eee;
        border-color: #ddd;
      }

      .section-label {
        color: #999;
      }

      .btn--secondary {
        background: #f0f0f0;
        color: #333;
      }

      .btn--secondary:hover {
        background: #e4e4e4;
      }

      .divider {
        border-color: #eee;
      }

      .footer {
        color: #999;
      }
    }
  </style>
</head>
